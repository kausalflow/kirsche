[tool.poetry]
name = "kirsche"
version = "0.3.0"
description = "The command line for Lightkone, the web reference manager: your papers, BibTeX and citation map from the terminal."
authors = ["LM <hi@leima.is>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
click = ">=8.1.7"
requests = "^2.26.0"
typer = ">=0.12"
loguru = "^0.5.3"
bibtexparser = "^1.2.0"
matplotlib = "^3.4.3"
pyecharts = "^1.5.0"
pandas = ">=2.0"
openpyxl = "^3.0.7"
cryptography = { version = ">=41", optional = true }
networkx = { version = ">=3.0", optional = true }

[tool.poetry.extras]
crypto = ["cryptography"]
graph = ["networkx"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
pytest-cov = "4.0.0"
cryptography = ">=41"
networkx = ">=3.0"

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.5.31"
mkdocs-autorefs = "^1.0.1"
mkdocstrings = {version = "^0.25.2", extras = ["python"]}
mkdocs-jupyter = "^0.24.8"
mkdocs = "^1.6.0"
mkdocs-click = "^0.4.0"

[tool.poetry.scripts]
kirsche = "kirsche.cli:run"
lightkone = "kirsche.cli:run"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
# The pre-commit hook runs mypy in its own environment without the package's
# dependencies; their types are checked in CI's test environment instead.
ignore_missing_imports = true
